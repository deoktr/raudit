[workspace]
members = ["crates/cli", "crates/core", "crates/modules", "crates/rules"]
resolver = "3"

[workspace.package]
version = "0.40.1"
edition = "2024"
authors = ["deoktr"]
license = "GPL-3.0-or-later"
repository = "https://github.com/deoktr/raudit"

[workspace.dependencies]
raudit-core = { path = "crates/core" }
raudit-modules = { path = "crates/modules" }
raudit-rules = { path = "crates/rules" }

clap = { version = "4.5.29", features = ["derive", "env"] }
flate2 = "1.1.10"
once_cell = "1.21.3"
rayon = "1.10.0"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(test)"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
