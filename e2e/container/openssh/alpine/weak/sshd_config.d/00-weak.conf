# NOTE: FingerprintHash md5 is not supported by Alpine's openssh (SSH_001
# defaults to SHA256), and the options unsupported by this build are omitted,
# see the hardened profile note (SSH_016..SSH_020, SSH_036, SSH_044).
SyslogFacility LOCAL0
LogLevel QUIET
LoginGraceTime 600
PermitRootLogin yes
StrictModes no
MaxAuthTries 20
MaxSessions 50
MaxStartups 100:30:200
HostbasedAuthentication yes
IgnoreRhosts no
IgnoreUserKnownHosts no
PubkeyAuthentication yes
PasswordAuthentication yes
PermitEmptyPasswords yes
KbdInteractiveAuthentication yes
DisableForwarding no
AllowAgentForwarding yes
AllowTcpForwarding yes
GatewayPorts yes
PermitTunnel yes
X11Forwarding yes
X11UseLocalhost no
PrintMotd yes
PermitUserEnvironment yes
UseDNS yes
TCPKeepAlive yes
ClientAliveInterval 30
ClientAliveCountMax 9
Ciphers chacha20-poly1305@openssh.com,aes128-ctr,aes192-ctr,aes256-ctr
MACs umac-64-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com
Subsystem sftp /usr/lib/ssh/sftp-server
