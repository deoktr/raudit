# NOTE: options unsupported by this Alpine build are omitted, `sshd -T` never
# reports them and the matching checks fail here:
# - PrintLastLog (SSH_036), musl has no wtmp/lastlog
# - Kerberos*/GSSAPI* (SSH_016..SSH_020) and UsePAM (SSH_044), the plain
#   openssh-server package is built without them
FingerprintHash SHA256
SyslogFacility AUTH
LogLevel VERBOSE
LoginGraceTime 30
PermitRootLogin no
StrictModes yes
MaxAuthTries 4
MaxSessions 4
HostbasedAuthentication no
IgnoreRhosts yes
IgnoreUserKnownHosts yes
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
DisableForwarding yes
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
X11Forwarding no
X11UseLocalhost yes
PrintMotd no
PermitUserEnvironment no
UseDNS no
TCPKeepAlive no
ClientAliveInterval 15
ClientAliveCountMax 3
MaxStartups 10:30:60
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com
AcceptEnv LANG LC_*
Subsystem sftp /usr/lib/openssh/sftp-server -f AUTHPRIV -l INFO
AllowGroups sshusers
