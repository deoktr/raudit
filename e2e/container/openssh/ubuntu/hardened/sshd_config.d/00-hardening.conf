# Ubuntu's openssh is built with PAM, Kerberos and GSSAPI support and glibc
# keeps wtmp/lastlog, so unlike the Alpine profile this one sets the seven
# build-dependent options explicitly and passes their checks
# (SSH_016..SSH_020, SSH_036, SSH_044).
#
# KexAlgorithms is left at its default on purpose: SSH_038 expects an exact
# list starting with `mlkem768x25519-sha256`, which openssh 9.6p1 (noble) does
# not implement, so no configuration of this image can pass it, see
# e2e/findings_ubuntu.md (U3).
FingerprintHash SHA256
SyslogFacility AUTH
LogLevel VERBOSE
LoginGraceTime 30
PermitRootLogin no
StrictModes yes
MaxAuthTries 4
MaxSessions 4
HostbasedAuthentication no
IgnoreRhosts yes
IgnoreUserKnownHosts yes
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
UsePAM yes
KerberosAuthentication no
KerberosOrLocalPasswd no
KerberosTicketCleanup yes
GSSAPIAuthentication no
GSSAPICleanupCredentials yes
PrintLastLog yes
DisableForwarding yes
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
X11Forwarding no
X11UseLocalhost yes
PrintMotd no
PermitUserEnvironment no
UseDNS no
TCPKeepAlive no
ClientAliveInterval 15
ClientAliveCountMax 3
MaxStartups 10:30:60
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com
AcceptEnv LANG LC_*
Subsystem sftp /usr/lib/openssh/sftp-server -f AUTHPRIV -l INFO
AllowGroups sshusers
