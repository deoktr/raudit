# The build-dependent options the Alpine weak profile has to omit are set to
# their insecure values here, Ubuntu's openssh reports them in `sshd -T`
# (SSH_016..SSH_020, SSH_036, SSH_044). `FingerprintHash md5` is rejected by
# Alpine's openssh but accepted by openssh 9.6p1, so SSH_001 fails here too.
# KexAlgorithms stays at its default, SSH_038 cannot pass on this build, see
# e2e/findings_ubuntu.md (U3).
FingerprintHash md5
SyslogFacility LOCAL0
LogLevel QUIET
LoginGraceTime 600
PermitRootLogin yes
StrictModes no
MaxAuthTries 20
MaxSessions 50
MaxStartups 100:30:200
HostbasedAuthentication yes
IgnoreRhosts no
IgnoreUserKnownHosts no
PubkeyAuthentication yes
PasswordAuthentication yes
PermitEmptyPasswords yes
KbdInteractiveAuthentication yes
UsePAM no
KerberosAuthentication yes
KerberosOrLocalPasswd yes
KerberosTicketCleanup no
GSSAPIAuthentication yes
GSSAPICleanupCredentials no
PrintLastLog no
DisableForwarding no
AllowAgentForwarding yes
AllowTcpForwarding yes
GatewayPorts yes
PermitTunnel yes
X11Forwarding yes
X11UseLocalhost no
PrintMotd yes
PermitUserEnvironment yes
UseDNS yes
TCPKeepAlive yes
ClientAliveInterval 30
ClientAliveCountMax 9
Ciphers chacha20-poly1305@openssh.com,aes128-ctr,aes192-ctr,aes256-ctr
MACs umac-64-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com
Subsystem sftp /usr/lib/openssh/sftp-server
