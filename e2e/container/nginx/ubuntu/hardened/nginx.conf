# rAudit e2e hardened nginx profile: version hidden, security headers and an
# HTTP to HTTPS redirect (NGX_001, NGX_002, NGX_003, NGX_005, NGX_006)
# Ubuntu stock layout: www-data worker user, /run/nginx.pid, dynamic modules
include /etc/nginx/modules-enabled/*.conf;

user www-data;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "no-referrer" always;

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/e2e.crt;
        ssl_certificate_key /etc/nginx/ssl/e2e.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            root /var/www/html;
            index index.html;
        }
    }
}
