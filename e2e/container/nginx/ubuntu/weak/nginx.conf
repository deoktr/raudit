# rAudit e2e weak nginx profile: version disclosed, no security headers, no
# HTTPS redirect, plaintext HTTP only
include /etc/nginx/modules-enabled/*.conf;

user www-data;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server_tokens on;

    server {
        listen 80 default_server;
        server_name _;

        location / {
            root /var/www/html;
            index index.html;
        }
    }
}
